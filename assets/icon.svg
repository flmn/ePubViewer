      <rect x="210" y="446" width="218" height="14" rx="7"/>
      <rect x="210" y="502" width="150" height="14" rx="7"/>
      <rect x="596" y="390" width="218" height="14" rx="7"/>
      <rect x="596" y="446" width="218" height="14" rx="7"/>
      <rect x="596" y="502" width="150" height="14" rx="7"/>
    </g>

    <!-- 书签 -->
    <path d="M482 292 L542 292 L542 708 L512 668 L482 708 Z" fill="#E5A13C"/>
  </g>
